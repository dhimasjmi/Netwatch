# /etc/postgresql/16/main/conf.d/netwatch.conf  (lalu: systemctl restart postgresql)
# Nilai di bawah untuk VM 8 GB RAM, disk SSD, PostgreSQL berbagi mesin dengan PHP/Nginx.
# VM 4 GB : shared_buffers=1GB,  effective_cache_size=2500MB, maintenance_work_mem=256MB
# VM 16 GB: shared_buffers=4GB,  effective_cache_size=11GB,   maintenance_work_mem=1GB

shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 512MB

# Tulis WAL lebih jarang tetapi halus (banyak INSERT heartbeat/bandwidth).
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Tabel besar dengan banyak INSERT/DELETE (heartbeat, bandwidth, browsing): vacuum lebih sering dan lebih awal.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# Catat query lambat (> 1 detik) untuk penelusuran.
log_min_duration_statement = 1000
log_lock_waits = on
