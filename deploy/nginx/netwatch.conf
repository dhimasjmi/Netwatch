# /etc/nginx/sites-available/netwatch  (lalu: ln -s ke sites-enabled, nginx -t, systemctl reload nginx)
# Ganti netwatch.perusahaan.local dan path sertifikat sesuai server Anda.

server {
    listen 80;
    listen [::]:80;
    server_name netwatch.perusahaan.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netwatch.perusahaan.local;

    ssl_certificate     /etc/ssl/netwatch/netwatch.crt;
    ssl_certificate_key /etc/ssl/netwatch/netwatch.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:NetWatchSSL:10m;

    root /var/www/netwatch/server/public;
    index index.php;
    charset utf-8;

    client_max_body_size 5m;
    server_tokens off;

    access_log /var/log/nginx/netwatch.access.log;
    error_log  /var/log/nginx/netwatch.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hanya index.php yang boleh dieksekusi; file .php lain di web root ditolak.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ {
        return 404;
    }

    # Berkas tersembunyi (.env, .git) tidak boleh diakses.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
